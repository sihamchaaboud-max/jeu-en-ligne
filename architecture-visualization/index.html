<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena — Architecture des bases de données</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style.extra.css">
</head>
<body>
<div class="bg-ambient"><div class="bg-orb bg-orb-1"></div><div class="bg-orb bg-orb-2"></div><div class="bg-orb bg-orb-3"></div></div>
<div class="app-wrapper">
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">🎮</div>
      <div><div class="header-title">Arena</div><div class="header-subtitle">Architecture · MongoDB · Redis · Neo4j</div></div>
    </div>
    <nav class="header-nav">
      <button class="nav-btn active" data-view="global">Vue globale</button>
      <button class="nav-btn" data-view="mongodb">🍃 MongoDB</button>
      <button class="nav-btn" data-view="redis">🔴 Redis</button>
      <button class="nav-btn" data-view="neo4j">🕸️ Neo4j</button>
    </nav>
    <div class="header-actions">
      <div class="search-box"><span class="search-icon">🔍</span><input id="search-trigger" placeholder="Rechercher (Ctrl+K)" readonly></div>
    </div>
  </header>
  <main class="main-content">
    <section class="view arch-view active" id="view-global">
      <div class="project-hero" id="project-hero"></div>
      <div><div class="section-label">Bases de données</div><div class="db-cards-row" id="db-cards"></div></div>
      <div>
        <div class="section-label">Architecture globale</div>
        <div class="arch-wrap">
          <div class="diagram-container">
            <div class="diagram-toolbar">
              <button class="tool-btn" id="arch-zoom-in" title="Zoom +">+</button>
              <button class="tool-btn" id="arch-zoom-out" title="Zoom −">−</button>
              <button class="tool-btn" id="arch-reset" title="Réinitialiser">⟲</button>
            </div>
            <div id="arch-canvas"></div>
          </div>
          <aside class="info-panel" id="info-panel"></aside>
        </div>
      </div>
      <div><div class="section-label">Flux de données</div><div class="flows-grid" id="data-flows"></div></div>
      <div><div class="section-label">Technologies</div><div class="tech-grid" id="tech-grid"></div></div>
    </section>
    <section class="db-view" id="view-mongodb"></section>
    <section class="db-view" id="view-redis"></section>
    <section class="db-view" id="view-neo4j"></section>
  </main>
</div>
<div class="search-overlay" id="search-overlay">
  <div class="search-modal">
    <div class="search-modal-header"><span>🔍</span><input class="search-modal-input" id="search-input" placeholder="Composant, collection, champ, flux…" autocomplete="off"></div>
    <div class="search-modal-results" id="search-results"></div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
